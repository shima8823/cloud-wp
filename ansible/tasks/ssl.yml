---
# Let's Encrypt SSL証明書の取得と更新設定
- name: Configure Let's Encrypt
  when: dynu_hostname != '' and letsencrypt_email != ''
  block:
    # standalone 方式のため更新時にポート80を空ける必要がある。
    # --pre-hook / --post-hook により実際に更新が行われるときだけ停止・再起動する。
    # TODO: webroot方式に変更する
    - name: Wait for DNS propagation
      ansible.builtin.command: "dig +short {{ dynu_hostname }}"
      register: dns_check
      until: dns_check.stdout | trim == instance_public_ip
      retries: 10
      delay: 30
      changed_when: false

    - name: Obtain Let's Encrypt certificate
      ansible.builtin.command: >
        certbot certonly
        --standalone
        --preferred-challenges http
        -d {{ dynu_hostname }}
        --email {{ letsencrypt_email }}
        --agree-tos
        --non-interactive
      args:
        creates: "/etc/letsencrypt/live/{{ dynu_hostname }}/fullchain.pem"

    - name: Setup certbot renewal cron job
      ansible.builtin.cron:
        name: "Renew Let's Encrypt certificates"
        minute: "5"
        hour: "3"
        day: "1,15"
        job: >-
          certbot renew --standalone
          --pre-hook "docker compose -f {{ srcs_dir }}/docker-compose.yml down"
          --post-hook "docker compose -f {{ srcs_dir }}/docker-compose.yml up -d"
          >> /var/log/certbot-renewal.log 2>&1
