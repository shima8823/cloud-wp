---
# Docker のインストールと設定
- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

# Docker リポジトリは Ubuntu 20.04 (focal) / amd64 固定。
# Terraform (infra/app/compute.tf) の AMI 選択と一致させる必要がある。
- name: Add Docker's official repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu focal stable"

- name: Install docker engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-compose-plugin
    update_cache: true

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
